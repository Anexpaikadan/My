/* ── Header ── */
.hdr{
  background:linear-gradient(90deg,#003087,#c8102e);
  padding:.7rem 1rem;

.hdr-badge{

/* ── Main layout ── */
.container{padding:.8rem;max-width:480px;margin:0 auto;padding-bottom:5rem}

/* ── Section cards ── */
.card{
  background:rgba(255,255,255,.04);

  border-radius:16px;
  overflow:hidden;
  margin-bottom:.8rem;
}

  display:flex;align-items:center;gap:.5rem;
  border-bottom:1px solid rgba(255,255,255,.06);
}
.card-head h3{

}
.card-body{padding:.9rem}

/* ── Country selector ── */
.country-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:.4rem;
}
.country-btn{
  padding:.5rem .3rem;

.country-btn.active .cname{color:var(--fifa-gold)}

/* ── Template selector ── */
.template-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:.5rem}
.tpl-btn{
  aspect-ratio:3/4;
  border:2px solid rgba(255,255,255,.1);
  border-radius:10px;

  position:relative;

.tpl-btn canvas{width:100%;height:100%;display:block}
.tpl-label{
  position:absolute;bottom:0;left:0;right:0;
  background:linear-gradient(transparent,rgba(0,0,0,.8));

<script>
// ── Data ──────────────────────────────────────────────────────
var TEAMS = [
  {flag:'🇸🇦',name:'Saudi Arabia',c1:'#006c35',c2:'#fff',abbr:'KSA'},
  {flag:'🇶🇦',name:'Qatar',      c1:'#8d1b3d',c2:'#fff',abbr:'QAT'},
  {flag:'🇵🇸',name:'Palestine',  c1:'#000',   c2:'#e4312b',abbr:'PAL'},
  {flag:'🇲🇦',name:'Morocco',    c1:'#c1272d',c2:'#006233',abbr:'MAR'},
  {flag:'🇮🇳',name:'India',      c1:'#ff9933', c2:'#138808',abbr:'IND'},
  {flag:'🇧🇷',name:'Brazil',     c1:'#009c3b',c2:'#ffdf00',abbr:'BRA'},
  {flag:'🇦🇷',name:'Argentina',  c1:'#74acdf',c2:'#fff',abbr:'ARG'},
  {flag:'🇫🇷',name:'France',     c1:'#002395',c2:'#ed2939',abbr:'FRA'},
  {flag:'🇩🇪',name:'Germany',    c1:'#000',   c2:'#dd0000',abbr:'GER'},
  {flag:'🇪🇸',name:'Spain',      c1:'#c60b1e',c2:'#ffc400',abbr:'ESP'},
  {flag:'🇵🇹',name:'Portugal',   c1:'#006600',c2:'#ff0000',abbr:'POR'},
  {flag:'🏴󠁧󠁢󠁥󠁮󠁧󠁿',name:'England',    c1:'#fff',   c2:'#cf081f',abbr:'ENG'},
];

var TEMPLATES = [
  {name:'FIRE',     id:'fire'},
  {name:'NIGHT',    id:'night'},
  {name:'GOLD',     id:'gold'},
  {name:'GRUNGE',   id:'grunge'},
  {name:'NEON',     id:'neon'},
  {name:'FLAG',     id:'flag'},
];

var selectedTeam = TEAMS[0];
var selectedTemplate = 'fire';
var selectedPos = 'FWD';
var jerseyNum = 10;
var playerPhoto = null;

// ── Render team grid ──────────────────────────────────────────
var grid = document.getElementById('countryGrid');
TEAMS.forEach(function(t,i){
  var d = document.createElement('div');
  d.className = 'country-btn' + (i===0?' active':'');
  d.innerHTML = '<span class="flag">'+t.flag+'</span><span class="cname">'+t.name+'</span>';
  d.onclick = function(){
    document.querySelectorAll('.country-btn').forEach(function(b){b.classList.remove('active')});
    d.classList.add('active');
    selectedTeam = t;
    renderPreview();
  };
  grid.appendChild(d);
});

// ── Render template grid ──────────────────────────────────────
var tGrid = document.getElementById('templateGrid');
TEMPLATES.forEach(function(t,i){
  var wrap = document.createElement('div');
  wrap.className = 'tpl-btn' + (i===0?' active':'');
  wrap.dataset.id = t.id;
  var c = document.createElement('canvas');
  c.width = 120; c.height = 160;
  wrap.appendChild(c);
  var lbl = document.createElement('div');
  lbl.className = 'tpl-label';
  lbl.textContent = t.name;
  wrap.appendChild(lbl);
  wrap.onclick = function(){
    document.querySelectorAll('.tpl-btn').forEach(function(b){b.classList.remove('active')});
    wrap.classList.add('active');
    selectedTemplate = t.id;
    renderPreview();
  };
  tGrid.appendChild(wrap);
  renderTemplateThumbnail(c, t.id, i);
});

function renderTemplateThumbnail(canvas, id, i){
  var ctx = canvas.getContext('2d');
  var W=120,H=160;
  var palettes = {
    fire:  ['#1a0000','#8b0000','#ff4500'],
    night: ['#0a0e2a','#003087','#00bfff'],
    gold:  ['#1a1000','#8b6914','#f5a623'],
    grunge:['#1a1a1a','#333','#ff2200'],
    neon:  ['#000a1a','#0d1b2a','#00ff88'],
    flag:  ['#003087','#fff','#c8102e'],
  };
  var p = palettes[id] || palettes.fire;
  var bg = ctx.createLinearGradient(0,0,W,H);
  bg.addColorStop(0,p[0]);bg.addColorStop(.5,p[1]);bg.addColorStop(1,p[0]);
  ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
  ctx.fillStyle=p[2];ctx.globalAlpha=.15;
  // Pattern
  for(var j=0;j<6;j++){
    ctx.beginPath();ctx.arc(W/2,H/2,30+j*12,0,Math.PI*2);
    ctx.stroke();
  }
  ctx.globalAlpha=1;
  // Mini text
  ctx.fillStyle=p[2];ctx.font='bold 11px Bebas Neue,sans-serif';
  ctx.textAlign='center';ctx.fillText('⚽',W/2,H/2+4);
  ctx.font='bold 8px Bebas Neue,sans-serif';ctx.fillText('2026',W/2,H-16);
}

// ── Position select ───────────────────────────────────────────
function selectPos(el, pos){
  document.querySelectorAll('.pos-btn').forEach(function(b){
    b.classList.remove('pos-active');
    b.style.borderColor='rgba(255,255,255,.1)';
    b.style.color='rgba(255,255,255,.7)';
    b.style.background='rgba(255,255,255,.06)';
  });
  el.style.borderColor='#f5a623';
  el.style.color='#f5a623';
  el.style.background='rgba(245,166,35,.1)';
  selectedPos = pos;
}
// Init first active
document.querySelectorAll('.pos-btn').forEach(function(b){
  if(b.textContent.trim()==='FWD'){
    b.style.borderColor='#f5a623';b.style.color='#f5a623';b.style.background='rgba(245,166,35,.1)';
  }
});

// ── Jersey number ─────────────────────────────────────────────
function changeNum(d){
  jerseyNum = Math.max(1,Math.min(99,(parseInt(document.getElementById('jerseyNum').value)||10)+d));
  document.getElementById('jerseyNum').value = jerseyNum;
  document.getElementById('numDisplay').textContent = jerseyNum;
}

// ── Photo handling ────────────────────────────────────────────
function handlePhoto(input){
  if(!input.files||!input.files[0]) return;
  var r = new FileReader();
  r.onload = function(e){
    playerPhoto = e.target.result;
    document.getElementById('photoPreview').src = playerPhoto;
    document.getElementById('uploadArea').style.display = 'none';
    document.getElementById('photoPreviewWrap').style.display = 'block';
    renderPreview();
  };
  r.readAsDataURL(input.files[0]);
}
function removePhoto(){
  playerPhoto = null;
  document.getElementById('uploadArea').style.display = 'block';
  document.getElementById('photoPreviewWrap').style.display = 'none';
  document.getElementById('photoInput').value = '';
  renderPreview();
}

// ── Main canvas renderer ──────────────────────────────────────
var C = document.getElementById('mainCanvas');
var ctx = C.getContext('2d');
var W = 800, H = 800;

function renderPreview(){
  ctx.clearRect(0,0,W,H);
  var t = selectedTemplate;
  var team = selectedTeam;
  var name = (document.getElementById('playerName').value||'YOUR NAME').toUpperCase();
  var num  = document.getElementById('jerseyNum').value || '10';
  var pos  = selectedPos;
  var fav  = document.getElementById('favPlayer').value||'';

  if(t==='fire')   drawFirePoster(team,name,num,pos,fav);
  else if(t==='night') drawNightPoster(team,name,num,pos,fav);
  else if(t==='gold')  drawGoldPoster(team,name,num,pos,fav);
  else if(t==='grunge') drawGrungePoster(team,name,num,pos,fav);
  else if(t==='neon')  drawNeonPoster(team,name,num,pos,fav);
  else if(t==='flag')  drawFlagPoster(team,name,num,pos,fav);
}

// ── Template: FIRE ───────────────────────────────────────────
function drawFirePoster(team,name,num,pos,fav){
  // BG
  var bg=ctx.createRadialGradient(W/2,H,0,W/2,H/2,W);
  bg.addColorStop(0,'#ff4500');bg.addColorStop(.4,'#8b0000');bg.addColorStop(1,'#1a0000');
  ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);

  // Fire rays
  ctx.save();ctx.globalAlpha=.15;
  for(var i=0;i<24;i++){
    ctx.save();ctx.translate(W/2,H);ctx.rotate((i/24)*Math.PI*2);
    var lg=ctx.createLinearGradient(0,0,0,-H);

// ── Shared helpers ────────────────────────────────────────────
function drawPhotoCircle(cx,cy,r,c1,c2){
  // Outer glow ring
  ctx.save();
  ctx.shadowColor=c2;ctx.shadowBlur=25;
  ctx.beginPath();ctx.arc(cx,cy,r+10,0,Math.PI*2);
  var rg=ctx.createLinearGradient(cx-r,cy-r,cx+r,cy+r);
  rg.addColorStop(0,c2);rg.addColorStop(.5,c1);rg.addColorStop(1,c2);
  ctx.strokeStyle=rg;ctx.lineWidth=4;ctx.stroke();
  ctx.restore();

  // Photo or placeholder
  ctx.save();
  ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);ctx.clip();

  if(playerPhoto){
    var img=new Image();
    img.onload=function(){
      ctx.save();ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);ctx.clip();
      // Cover fit
      var scale=Math.max(r*2/img.width,r*2/img.height);
      var iw=img.width*scale,ih=img.height*scale;
      ctx.drawImage(img,cx-iw/2,cy-ih/2,iw,ih);
      ctx.restore();
      // Redraw overlays after image loads
      setTimeout(function(){ renderPreview(); },50);
    };
    img.src=playerPhoto;
    // Draw placeholder while loading
    ctx.fillStyle='rgba(0,0,0,.3)';ctx.fillRect(cx-r,cy-r,r*2,r*2);
    ctx.font='80px serif';ctx.textAlign='center';ctx.fillStyle='rgba(255,255,255,.3)';
    ctx.fillText('🤳',cx,cy+28);
  } else {
    // Placeholder
    var pg=ctx.createRadialGradient(cx,cy-20,0,cx,cy,r);
    pg.addColorStop(0,'rgba(255,255,255,.15)');pg.addColorStop(1,'rgba(0,0,0,.3)');
    ctx.fillStyle=pg;ctx.fillRect(cx-r,cy-r,r*2,r*2);
    ctx.font='80px serif';ctx.textAlign='center';ctx.fillStyle='rgba(255,255,255,.4)';
    ctx.fillText('📸',cx,cy+28);
    ctx.font='bold 20px Rajdhani,sans-serif';ctx.fillStyle='rgba(255,255,255,.4)';
    ctx.fillText('ADD YOUR PHOTO',cx,cy+75);
  }
  ctx.restore();
}

function drawFIFABadge(cx,y){
  // FIFA WC 2026 badge
  ctx.save();
  ctx.textAlign='center';

  // Badge background
  var bw=280,bh=38;
  var bx=cx-bw/2;
  var bg=ctx.createLinearGradient(bx,y-bh,bx+bw,y);
  bg.addColorStop(0,'rgba(0,48,135,.6)');
  bg.addColorStop(.5,'rgba(200,16,46,.6)');
  bg.addColorStop(1,'rgba(0,48,135,.6)');
  ctx.fillStyle=bg;
  roundRect2(ctx,bx,y-bh,bw,bh,8);ctx.fill();

  ctx.strokeStyle='rgba(255,255,255,.2)';ctx.lineWidth=1;
  roundRect2(ctx,bx,y-bh,bw,bh,8);ctx.stroke();

  ctx.font='bold 20px "Bebas Neue",sans-serif';
  ctx.fillStyle='#fff';ctx.letterSpacing='0.12em';
  ctx.fillText('⚽  FIFA WORLD CUP 2026  ⚽',cx,y-8);
  ctx.restore();
}

function roundRect2(ctx,x,y,w,h,r){
  ctx.beginPath();ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.arcTo(x+w,y,x+w,y+r,r);
  ctx.lineTo(x+w,y+h-r);ctx.arcTo(x+w,y+h,x+w-r,y+h,r);ctx.lineTo(x+r,y+h);
  ctx.arcTo(x,y+h,x,y+h-r,r);ctx.lineTo(x,y+r);ctx.arcTo(x,y,x+r,y,r);ctx.closePath();
}

// ── Generate (re-render with latest inputs) ───────────────────
var loadSteps=['Setting up the pitch...','Placing your photo...','Drawing team colors...','Adding details...','Final touches...'];
function generatePoster(){
  var li=document.getElementById('loadingOverlay');
  li.classList.add('show');
  var si=0;
  var iv=setInterval(function(){
    document.getElementById('loadStep').textContent=loadSteps[si++%loadSteps.length];
  },600);
  setTimeout(function(){
    clearInterval(iv);
    renderPreview();
    li.classList.remove('show');
    toast('🎉 Poster ready!','ok');
    document.getElementById('mainCanvas').scrollIntoView({behavior:'smooth',block:'center'});
  },2400);
}

// ── Download ──────────────────────────────────────────────────
function downloadPoster(){
  var name=(document.getElementById('playerName').value||'fan').replace(/\s+/g,'_');
  var a=document.createElement('a');
  a.href=C.toDataURL('image/png');
  a.download='WC2026_'+name+'_Poster.png';
  a.click();
  toast('📥 Downloaded!','ok');
}

// ── WhatsApp share ────────────────────────────────────────────
function sharePoster(){
  var name=document.getElementById('playerName').value||'Fan';
  var team=selectedTeam.name;
  var num=document.getElementById('jerseyNum').value||'10';
  var msg='⚽ *FIFA WORLD CUP 2026*\n🏆 I am a proud '+team+' fan!\n\n👤 '+name.toUpperCase()+' | #'+num+' | '+selectedPos+'\n\n🌐 mynamecc.online\n\n🏅 Aishwarya Arts & Sports Club, Vettikkattiri';

  // Try native share with image
  C.toBlob(function(blob){
    var file=new File([blob],'WC2026_Fan_Poster.png',{type:'image/png'});
    if(navigator.share&&navigator.canShare&&navigator.canShare({files:[file]})){
      navigator.share({files:[file],text:msg,title:'My FIFA WC 2026 Fan Poster'});
    } else {
      // Download and open WA
      downloadPoster();
      setTimeout(function(){
        window.open('https://wa.me/?text='+encodeURIComponent(msg),'_blank');
      },500);
    }
  });
}

// ── Toast ─────────────────────────────────────────────────────
function toast(msg,type){
  var el=document.getElementById('toast');
  el.textContent=msg;
  el.className='toast show'+(type==='ok'?' ok':type==='err'?' err':'');
  setTimeout(function(){el.className='toast'},2500);
}

// ── Live preview on input ─────────────────────────────────────
['playerName','jerseyNum','favPlayer'].forEach(function(id){
  var el=document.getElementById(id);
  if(el) el.addEventListener('input',function(){renderPreview();});
});

// ── Initial render ────────────────────────────────────────────
document.fonts.ready.then(function(){ renderPreview(); });
renderPreview();
